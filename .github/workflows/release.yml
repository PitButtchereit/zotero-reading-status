name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build .xpi
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd reading-status
          jq --arg v "$VERSION" '.version = $v' manifest.json > m.tmp && mv m.tmp manifest.json
          zip -r ../reading-status.xpi manifest.json bootstrap.js locale
          cd ..
          ID=$(jq -r '.applications.zotero.id' reading-status/manifest.json)
          MAX=$(jq -r '.applications.zotero.strict_max_version' reading-status/manifest.json)
          MIN=$(jq -r '.applications.zotero.strict_min_version' reading-status/manifest.json)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/reading-status.xpi"
          jq -n --arg id "$ID" --arg v "$VERSION" --arg url "$URL" --arg min "$MIN" --arg max "$MAX" \
            '{addons: {($id): {updates: [{version: $v, update_link: $url,
              applications: {zotero: {strict_min_version: $min, strict_max_version: $max}}}]}}}' > updates.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" reading-status.xpi updates.json --generate-notes
